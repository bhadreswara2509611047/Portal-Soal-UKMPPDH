    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatRichText(str) {
      // Escape HTML lalu format pangkat seperti 10^2 menjadi 10<sup>2</sup>
      const safe = escapeHTML(str);
      return safe.replace(/10\^(\d+)/g, '10<sup>$1</sup>');
    }

    function stripOptionPrefix(optText) {
      return String(optText).replace(/^[a-eA-E]\.\s*/, "").trim();
    }

    function formatClock(totalSec) {
      const sec = Math.max(0, Math.floor(totalSec));
      const hrs = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = sec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function formatDurationText(totalSec) {
      const sec = Math.max(0, Math.floor(totalSec));
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      if (mins === 0) return `${secs} detik`;
      return `${mins} menit ${secs} detik`;
    }

    function showToast(message, type = "info") {
      const root = document.getElementById("toast-root");
      if (!root) return;
      const toast = document.createElement("div");
      const colorClasses =
        type === "success"
          ? "bg-[#0f5c54] text-white border-[#eab308]"
          : type === "warning"
          ? "bg-amber-600 text-white border-amber-300"
          : "bg-slate-900 text-white border-slate-700";
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border-l-4 text-sm font-medium animate-fade-in ${colorClasses}`;
      toast.innerHTML = `<span>${escapeHTML(message)}</span>`;
      root.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";

    /**
     * ============================================================================
     * LOGIKA SESI UJIAN, TIMER & NAVIGASI
     * ============================================================================
     */
    function prepareSessionQuestions(rawQuestions, shouldShuffleQ, shouldShuffleOpt) {
      let list = [...rawQuestions];
      if (shouldShuffleQ) {
        list = shuffleArray(list);
      }
      return list.map((q) => {
        const paired = q.opsi.map((text, idx) => ({
          text: stripOptionPrefix(text),
          isCorrect: idx === q.kunci
        }));
        const finalPaired = shouldShuffleOpt ? shuffleArray(paired) : paired;
        return {
          id: q.id,
          category: q.category,
          kasus: q.kasus && q.kasus.trim() !== "-" ? q.kasus.trim() : "",
          tanya: q.tanya.trim(),
          options: finalPaired.map((p) => p.text),
          correctIndex: finalPaired.findIndex((p) => p.isCorrect),
          pembahasan: q.pembahasan.trim(),
          ref: q.ref.trim()
        };
      });
    }

    function startExamSession(customQuestions = null, customLabel = null) {
      stopTimer();

      const nameInput = document.getElementById("input-participant-name");
      if (nameInput) {
        const val = nameInput.value.trim();
        state.participantName = val || "Calon Dokter Hewan";
      }

      let rawQuestions = [];
      let minutes = 100;
      let label = "";

      if (customQuestions && customQuestions.length > 0) {
        rawQuestions = customQuestions;
        minutes = Math.max(5, rawQuestions.length);
        label = customLabel || `Latihan Ulang (${rawQuestions.length} Soal)`;
      } else {
        const pkg = EXAM_PACKAGES.find((p) => p.id === state.selectedPack) || EXAM_PACKAGES[0];
        rawQuestions = pkg.getQuestions(QUESTION_BANK);
        minutes = pkg.minutes;
        label = pkg.title;
      }

      state.sessionLabel = label;
      state.sessionQuestions = prepareSessionQuestions(
        rawQuestions,
        state.shuffleQuestions,
        state.shuffleOptions
      );
      state.currentIndex = 0;
      state.userAnswers = new Array(state.sessionQuestions.length).fill(null);
      state.flagged = new Array(state.sessionQuestions.length).fill(false);
      state.totalSeconds = minutes * 60;
      state.remainingSeconds = minutes * 60;
      state.elapsedSeconds = 0;
      state.mobileDrawerOpen = false;
      state.screen = "exam";

      startTimer();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startTimer() {
      stopTimer();
      state.timerInterval = setInterval(() => {
        if (state.screen !== "exam") {
          stopTimer();
          return;
        }
        state.elapsedSeconds += 1;
        if (state.remainingSeconds > 0) {
          state.remainingSeconds -= 1;
          updateTimerDOM();
          if (state.remainingSeconds === 0) {
            finishExam(true);
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function updateTimerDOM() {
      const timerEl = document.getElementById("cbt-timer-display");
      const timerBox = document.getElementById("cbt-timer-box");
      if (!timerEl || !timerBox) return;

      timerEl.textContent = formatClock(state.remainingSeconds);
      if (state.remainingSeconds < 300) {
        timerBox.className =
          "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-600 text-white font-mono font-bold text-sm sm:text-base shadow-sm animate-pulse";
      } else {
        timerBox.className =
          "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#134e4a] border border-white/20 text-[#eab308] font-mono font-bold text-sm sm:text-base";
      }
    }

    function selectAnswer(optionIndex) {
      if (state.screen !== "exam") return;
      state.userAnswers[state.currentIndex] = optionIndex;
      render();
    }

    function resetCurrentAnswer() {
      if (state.screen !== "exam") return;
      state.userAnswers[state.currentIndex] = null;
      render();
    }

    function toggleFlagCurrent() {
      if (state.screen !== "exam") return;
      state.flagged[state.currentIndex] = !state.flagged[state.currentIndex];
      render();
    }

    function goToQuestion(idx) {
      if (idx < 0 || idx >= state.sessionQuestions.length) return;
      state.currentIndex = idx;
      state.mobileDrawerOpen = false;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function changeFontSize(delta) {
      const next = Math.min(2, Math.max(0, state.fontSizeLevel + delta));
      if (next !== state.fontSizeLevel) {
        state.fontSizeLevel = next;
        render();
      }
    }

    function toggleMobileDrawer(forceVal = null) {
      state.mobileDrawerOpen = forceVal !== null ? forceVal : !state.mobileDrawerOpen;
      render();
    }

    function finishExam(autoSubmitted = false) {
      stopTimer();
      closeModal();
      state.mobileDrawerOpen = false;
      state.reviewFilter = "all";
      state.reviewCategoryFilter = "all";
      state.reviewSearch = "";
      state.screen = "results";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (autoSubmitted) {
        openTimeUpModal();
      }
    }

    function retryWrongQuestions() {
      const wrongOriginalIds = new Set();
      state.sessionQuestions.forEach((q, idx) => {
        const ans = state.userAnswers[idx];
        if (ans === null || ans !== q.correctIndex) {
          wrongOriginalIds.add(q.id);
        }
      });

      const subset = QUESTION_BANK.filter((item) => wrongOriginalIds.has(item.id));
      if (subset.length === 0) {
        showToast("Selamat! Tidak ada soal yang salah atau kosong.", "success");
        return;
      }
      startExamSession(subset, `Ulangi Soal Salah & Kosong (${subset.length} Soal)`);
    }

    function backToLobby() {
      stopTimer();
      closeModal();
      state.screen = "lobby";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /**
     * ============================================================================
     * KEYBOARD SHORTCUTS UNTUK ANTARMUKA CBT
     * - A, B, C, D, E -> Pilih opsi jawaban A-E
     * - ArrowLeft / ArrowRight -> Soal sebelumnya / selanjutnya
     * - R -> Tandai / Batal Ragu-ragu
     * ============================================================================
     */
    document.addEventListener("keydown", (e) => {
      if (state.screen !== "exam") return;
      const modalRoot = document.getElementById("modal-root");
      if (modalRoot && modalRoot.innerHTML.trim() !== "") return;

      const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;

      const key = e.key.toLowerCase();
      if (["a", "b", "c", "d", "e"].includes(key)) {
        e.preventDefault();
        const optIdx = key.charCodeAt(0) - 97;
        selectAnswer(optIdx);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        if (state.currentIndex < state.sessionQuestions.length - 1) {
          goToQuestion(state.currentIndex + 1);
        }
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (state.currentIndex > 0) {
          goToQuestion(state.currentIndex - 1);
        }
      } else if (key === "r") {
        e.preventDefault();
        toggleFlagCurrent();
      }
    });

                      <div class="text-sm font-bold text-slate-800">Acak Urutan Pilihan Jawaban</div>
                      <div class="text-xs text-slate-500">Mengacak posisi opsi A–E secara otomatis</div>

                    />
                    <div class="w-11 h-6 bg-slate-300 rounded-full peer peer-checked:bg-[#0f5c54] relative transition shrink-0 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
                  </label>
                </div>
              </section>

            </div>

            <!-- Kolom Kanan: Ringkasan Ujian & Panduan CBT -->
            <aside class="lg:col-span-4 space-y-5 lg:sticky lg:top-6">
              <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-[#134e4a] px-5 py-4 text-white border-b-2 border-[#eab308]">
                  <h3 class="font-bold text-base">Ringkasan Sesi Simulasi</h3>
                  <p class="text-xs text-emerald-100 mt-0.5">Periksa kembali konfigurasi sebelum memulai</p>

                <div class="p-5 space-y-3.5 text-sm">

                    <span class="text-slate-500">Peserta</span>
                    <span class="font-bold text-slate-900 truncate max-w-[180px]">${escapeHTML(
                      state.participantName.trim() || "Calon Dokter Hewan"

                  </div>
                  <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                    <span class="text-slate-500">Mode</span>
                    <span class="font-bold px-2.5 py-0.5 rounded-md text-xs ${
                      state.mode === "cbt"
                        ? "bg-[#e6f4f1] text-[#0f5c54]"
                        : "bg-amber-100 text-amber-800"
                    }">
                      ${state.mode === "cbt" ? "Ujian CBT Standar" : "Latihan Interaktif"}
                    </span>
                  </div>
                  <div class="flex justify-between items-start py-1.5 border-b border-slate-100 gap-2">
                    <span class="text-slate-500 shrink-0">Paket</span>
                    <span class="font-bold text-slate-900 text-right">${escapeHTML(selectedPkg.title)}</span>
                  </div>
                  <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                    <span class="text-slate-500">Jumlah &amp; Waktu</span>
                    <span class="font-bold text-[#0f5c54]">${selectedPkg.count} Soal • ${selectedPkg.minutes} Menit</span>
                  </div>
                  <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                    <span class="text-slate-500">Passing Grade</span>
                    <span class="font-bold text-slate-800">Skor &ge; 65 (LULUS)</span>
                  </div>
                  <div class="flex justify-between items-center py-1.5">
                    <span class="text-slate-500">Pengacakan</span>
                    <span class="text-xs font-semibold text-slate-700">
                      ${
                        state.shuffleQuestions && state.shuffleOptions
                          ? "Soal &amp; Opsi Diacak"
                          : state.shuffleQuestions
                          ? "Soal Diacak"
                          : state.shuffleOptions
                          ? "Opsi Diacak"
                          : "Urutan Standar"
                      }
                    </span>
                  </div>

                  <button
                    type="button"
                    onclick="startExamSession()"

                    <span>Mulai Simulasi Sekarang</span>
                    <svg class="w-5 h-5 text-[#eab308]" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Panduan Shortcut Keyboard -->
              <div class="bg-white rounded-2xl border border-slate-200 p-4 text-xs text-slate-600 space-y-2">
                <div class="font-bold text-slate-800 flex items-center gap-1.5">
                  <svg class="w-4 h-4 text-[#0f5c54]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                  </svg>
                  <span>Pintasan Keyboard CBT</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5 pt-1">
                  <div><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded font-mono font-bold text-slate-800">A</kbd>–<kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded font-mono font-bold text-slate-800">E</kbd> Pilih Jawaban</div>
                  <div><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded font-mono font-bold text-slate-800">R</kbd> Tandai Ragu-ragu</div>
                  <div class="col-span-2"><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded font-mono font-bold text-slate-800">&larr;</kbd> / <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded font-mono font-bold text-slate-800">&rarr;</kbd> Soal Sebelumnya / Selanjutnya</div>
                </div>
              </div>

          </div>
        </main>
      `;
    }

    /**
     * ============================================================================
     * RENDER 2: ANTARMUKA PENGERJAAN CBT
     * ============================================================================
     */
    function renderExam() {
      const q = state.sessionQuestions[state.currentIndex];
      const total = state.sessionQuestions.length;
      const userAns = state.userAnswers[state.currentIndex];
      const isFlagged = state.flagged[state.currentIndex];

      const answeredCount = state.userAnswers.filter((a) => a !== null).length;
      const flaggedCount = state.flagged.filter(Boolean).length;
      const unansweredCount = total - answeredCount;

      // Skala Ukuran Font
      const caseFontClass =
        state.fontSizeLevel === 0
          ? "text-xs sm:text-sm"
          : state.fontSizeLevel === 2
          ? "text-base sm:text-lg"
          : "text-sm sm:text-base";
      const questionFontClass =
        state.fontSizeLevel === 0
          ? "text-sm sm:text-base"
          : state.fontSizeLevel === 2
          ? "text-lg sm:text-xl"
          : "text-base sm:text-[17px]";
      const optionFontClass =
        state.fontSizeLevel === 0
          ? "text-xs sm:text-sm"
          : state.fontSizeLevel === 2
          ? "text-base sm:text-lg"
          : "text-sm sm:text-[15px]";

      const showInstantFeedback = state.mode === "practice" && userAns !== null;
      const isUserCorrect = userAns === q.correctIndex;

      // Grid Navigasi Nomor Soal (dipakai di desktop sidebar & mobile drawer)
      const renderNumberGrid = () => `
        <div class="grid grid-cols-5 gap-2">
          ${state.sessionQuestions
            .map((_, idx) => {
              const ans = state.userAnswers[idx];
              const flg = state.flagged[idx];
              const active = idx === state.currentIndex;

              let baseColor = "bg-white border-slate-300 text-slate-700 hover:bg-slate-50";
              if (flg) {
                baseColor = "bg-[#eab308] border-[#ca8a04] text-slate-950 font-extrabold";
              } else if (ans !== null) {
                baseColor = "bg-[#0f5c54] border-[#0f5c54] text-white font-bold";
              }

              const activeOutline = active
                ? "ring-2 ring-offset-2 ring-slate-900 scale-[1.03]"
                : "";

              return `
                <button
                  type="button"
                  onclick="goToQuestion(${idx})"
                  class="h-10 rounded-xl border text-xs sm:text-sm font-semibold transition flex items-center justify-center cursor-pointer ${baseColor} ${activeOutline}"
                  title="Soal ${idx + 1}"
                >
                  ${idx + 1}
                </button>
              `;
            })
            .join("")}
        </div>
      `;

      const isUrgent = state.remainingSeconds < 300;

      return `
        <!-- Header Atas CBT Sticky -->
        <header class="sticky top-0 z-30 bg-[#0f5c54] text-white shadow-md border-b-2 border-[#eab308]">
          <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 sm:py-3 flex flex-wrap items-center justify-between gap-2.5">
            
            <!-- Kiri: Identitas & Badge Soal -->
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-[#eab308] text-[#134e4a] font-extrabold text-sm flex items-center justify-center shrink-0">
                CBT
              </div>
              <div class="min-w-0">
                <div class="font-extrabold text-xs sm:text-sm tracking-tight truncate">
                  TRY OUT BATCH 3 — SIGAP UKMPPDH
                </div>
                <div class="flex items-center gap-1.5 text-[11px] text-emerald-100 truncate">
                  <span class="truncate">${escapeHTML(state.participantName)}</span>
                  <span>•</span>
                  <span class="text-[#fef08a] font-semibold">${
                    state.mode === "cbt" ? "Mode CBT" : "Mode Latihan"
                  }</span>
                </div>
              </div>
            </div>

            <!-- Kanan: Font Adjuster, Timer, Tombol Selesai -->
            <div class="flex items-center gap-2 sm:gap-3 ml-auto">
              <!-- Pengatur Ukuran Teks -->
              <div class="hidden md:flex items-center bg-[#134e4a] rounded-xl p-1 border border-white/15" title="Ukuran Teks Soal">
                <button
                  type="button"
                  onclick="changeFontSize(-1)"
                  class="px-2 py-1 rounded-lg text-xs font-bold transition ${
                    state.fontSizeLevel === 0 ? "bg-[#eab308] text-slate-950" : "text-white/80 hover:text-white"
                  }"
                >A-</button>
                <button
                  type="button"
                  onclick="state.fontSizeLevel = 1; render();"
                  class="px-2 py-1 rounded-lg text-xs font-bold transition ${
                    state.fontSizeLevel === 1 ? "bg-[#eab308] text-slate-950" : "text-white/80 hover:text-white"
                  }"
                >A</button>
                <button
                  type="button"
                  onclick="changeFontSize(1)"
                  class="px-2 py-1 rounded-lg text-xs font-bold transition ${
                    state.fontSizeLevel === 2 ? "bg-[#eab308] text-slate-950" : "text-white/80 hover:text-white"
                  }"
                >A+</button>
              </div>

              <!-- Timer Hitung Mundur -->
              <div
                id="cbt-timer-box"
                class="${
                  isUrgent
                    ? "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-600 text-white font-mono font-bold text-sm sm:text-base shadow-sm animate-pulse"
                    : "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#134e4a] border border-white/20 text-[#eab308] font-mono font-bold text-sm sm:text-base"
                }"
              >
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <span id="cbt-timer-display">${formatClock(state.remainingSeconds)}</span>
              </div>

              <!-- Toggle Drawer Mobile -->
              <button
                type="button"
                onclick="toggleMobileDrawer(true)"
                class="lg:hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#134e4a] hover:bg-[#0b4640] border border-white/20 text-white text-xs font-bold transition"
              >
                <svg class="w-4 h-4 text-[#eab308]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                </svg>
                <span>${answeredCount}/${total}</span>
              </button>

              <!-- Tombol Selesai Ujian -->
              <button
                type="button"
                onclick="openConfirmFinishModal()"
                class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-[#eab308] hover:bg-[#ca8a04] text-slate-950 font-extrabold text-xs sm:text-sm shadow-sm transition cursor-pointer"
              >
                Selesai Ujian
              </button>
            </div>
          </div>
        </header>

        <!-- Konten Utama CBT -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Area Soal Utama (Kiri / Tengah) -->
            <div class="lg:col-span-8 flex flex-col gap-4 animate-fade-in">
              
              <!-- Kartu Soal -->
              <article class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                <!-- Bar Informasi Soal -->
                <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="px-3 py-1 rounded-lg bg-[#0f5c54] text-white font-extrabold text-xs sm:text-sm">
                      Soal No. ${state.currentIndex + 1} <span class="font-normal text-emerald-200">/ ${total}</span>
                    </span>
                    <span class="px-3 py-1 rounded-lg bg-[#e6f4f1] text-[#134e4a] border border-[#0f5c54]/20 font-bold text-xs">
                      ${escapeHTML(q.category)}
                    </span>
                    ${
                      state.shuffleQuestions
                        ? `<span class="text-[11px] text-slate-400 font-medium">(Bank #${q.id})</span>`
                        : ""
                    }
                  </div>

                  <!-- Font Adjuster Mobile -->
                  <div class="flex md:hidden items-center bg-white rounded-lg p-0.5 border border-slate-200">
                    <button type="button" onclick="changeFontSize(-1)" class="px-2 py-0.5 text-xs font-bold text-slate-700">A-</button>
                    <button type="button" onclick="state.fontSizeLevel = 1; render();" class="px-2 py-0.5 text-xs font-bold text-slate-700">A</button>
                    <button type="button" onclick="changeFontSize(1)" class="px-2 py-0.5 text-xs font-bold text-slate-700">A+</button>
                  </div>
                </div>

                <!-- Isi Kasus & Pertanyaan -->
                <div class="p-5 sm:p-7 space-y-5">
                  ${
                    q.kasus
                      ? `
                        <div class="p-4 sm:p-5 rounded-xl bg-[#e6f4f1]/55 border-l-4 border-[#0f5c54] border-y border-r border-[#0f5c54]/15">
                          <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#0f5c54] mb-1.5 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                            </svg>
                            <span>Uraian Kasus</span>
                          </div>
                          <p class="${caseFontClass} text-slate-800 leading-relaxed font-normal">
                            ${formatRichText(q.kasus)}
                          </p>
                        </div>
                      `
                      : ""
                  }

                  <!-- Pertanyaan -->
                  <div>
                    <p class="${questionFontClass} font-bold text-slate-900 leading-relaxed">
                      ${formatRichText(q.tanya)}
                    </p>
                  </div>

                  <!-- Pilihan Jawaban A - E -->
                  <div class="space-y-3 pt-1">
                    ${q.options
                      .map((optText, optIdx) => {
                        const letter = OPTION_LETTERS[optIdx];
                        const isSelected = userAns === optIdx;
                        const isCorrectOpt = optIdx === q.correctIndex;

                        let cardStyle =
                          "border-slate-200 bg-white hover:border-[#0f5c54]/60 hover:bg-slate-50/80 text-slate-800";
                        let badgeStyle =
                          "bg-slate-100 text-slate-700 border-slate-300 group-hover:bg-[#0f5c54] group-hover:text-white group-hover:border-[#0f5c54]";
                        let statusTag = "";

                        if (showInstantFeedback) {
                          if (isCorrectOpt) {
                            cardStyle =
                              "border-emerald-600 bg-emerald-50/90 text-emerald-950 ring-1 ring-emerald-600";
                            badgeStyle = "bg-emerald-600 text-white border-emerald-600";
                            statusTag = `<span class="ml-auto shrink-0 px-2.5 py-0.5 rounded-full bg-emerald-600 text-white text-[11px] font-bold">Kunci Jawaban</span>`;
                          } else if (isSelected && !isCorrectOpt) {
                            cardStyle =
                              "border-rose-500 bg-rose-50/90 text-rose-950 ring-1 ring-rose-500";
                            badgeStyle = "bg-rose-600 text-white border-rose-600";
                            statusTag = `<span class="ml-auto shrink-0 px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-bold">Pilihan Anda</span>`;
                          }
                        } else if (isSelected) {
                          cardStyle =
                            "border-[#0f5c54] bg-[#e6f4f1] text-[#134e4a] ring-1 ring-[#0f5c54] shadow-xs";
                          badgeStyle = "bg-[#0f5c54] text-white border-[#0f5c54]";
                        }

                        return `
                          <button
                            type="button"
                            onclick="selectAnswer(${optIdx})"
                            class="group w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition flex items-center gap-3.5 cursor-pointer ${cardStyle}"
                          >
                            <span class="w-9 h-9 rounded-xl border font-extrabold text-sm flex items-center justify-center shrink-0 transition ${badgeStyle}">
                              ${letter}
                            </span>
                            <span class="${optionFontClass} font-medium leading-snug flex-1">
                              ${formatRichText(optText)}
                            </span>
                            ${statusTag}
                          </button>
                        `;
                      })
                      .join("")}
                  </div>

                  <!-- Panel Pembahasan Langsung (Khusus Mode Latihan Interaktif) -->
                  ${
                    showInstantFeedback
                      ? `
                        <div class="mt-6 rounded-2xl border-2 ${
                          isUserCorrect
                            ? "border-emerald-500 bg-emerald-50/60"
                            : "border-rose-400 bg-rose-50/60"
                        } p-4 sm:p-5 animate-fade-in">
                          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b ${
                            isUserCorrect ? "border-emerald-200" : "border-rose-200"
                          }">
                            <div class="flex items-center gap-2">
                              ${
                                isUserCorrect
                                  ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-extrabold">
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
                                      JAWABAN BENAR!
                                    </span>`
                                  : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-rose-600 text-white text-xs font-extrabold">
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
                                      JAWABAN KURANG TEPAT
                                    </span>`
                              }
                            </div>
                            <div class="text-xs font-bold text-slate-800 bg-white px-3 py-1 rounded-lg border border-slate-200">
                              Kunci Jawaban: <span class="text-emerald-700">${OPTION_LETTERS[q.correctIndex]}</span>
                            </div>
                          </div>

                          <div class="space-y-3 text-sm text-slate-800 leading-relaxed">
                            <div>
                              <div class="font-extrabold text-xs uppercase tracking-wider text-[#0f5c54] mb-1">Pembahasan Lengkap</div>
                              <p>${formatRichText(q.pembahasan)}</p>
                            </div>
                            <div class="pt-2 border-t border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
                              <div class="text-xs text-slate-600 break-all">
                                <span class="font-bold text-slate-800">Referensi: </span>
                                ${renderReferenceMarkup(q.ref)}
                              </div>
                            </div>
                          </div>
                        </div>
                      `
                      : ""
                  }
                </div>
              </article>

              <!-- Bar Navigasi Bawah -->
              <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-2.5">
                <!-- Sebelumnya -->
                <button
                  type="button"
                  onclick="goToQuestion(${state.currentIndex - 1})"
                  ${state.currentIndex === 0 ? "disabled" : ""}
                  class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs sm:text-sm hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none transition flex items-center gap-1.5 cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                  </svg>
                  <span>Sebelumnya</span>
                </button>

                <!-- Tengah: Reset & Ragu-ragu -->
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    onclick="resetCurrentAnswer()"
                    ${userAns === null ? "disabled" : ""}
                    class="px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-600 hover:text-rose-600 hover:border-rose-300 hover:bg-rose-50 font-semibold text-xs sm:text-sm disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer"
                  >
                    Reset Pilihan
                  </button>

                  <button
                    type="button"
                    onclick="toggleFlagCurrent()"
                    class="px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm border transition flex items-center gap-1.5 cursor-pointer ${
                      isFlagged
                        ? "bg-[#eab308] border-[#ca8a04] text-slate-950 shadow-xs"
                        : "bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100"
                    }"
                  >
                    <svg class="w-4 h-4" fill="${isFlagged ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v1.5M3 21v-6m0 0 2.77-.693a9 9 0 0 1 6.208.682l.108.054a9 9 0 0 0 6.086.71l3.114-.732a48.524 48.524 0 0 1-.005-10.499l-3.11.732a9 9 0 0 1-6.085-.711l-.108-.054a9 9 0 0 0-6.208-.682L3 4.5M3 15V4.5" />
                    </svg>
                    <span>Ragu-ragu</span>
                  </button>
                </div>

                <!-- Selanjutnya / Selesai -->
                ${
                  state.currentIndex < total - 1
                    ? `
                      <button
                        type="button"
                        onclick="goToQuestion(${state.currentIndex + 1})"
                        class="px-4 py-2.5 rounded-xl bg-[#0f5c54] hover:bg-[#0b4640] text-white font-semibold text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5 cursor-pointer"
                      >
                        <span>Selanjutnya</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                      </button>
                    `
                    : `
                      <button
                        type="button"
                        onclick="openConfirmFinishModal()"
                        class="px-5 py-2.5 rounded-xl bg-[#eab308] hover:bg-[#ca8a04] text-slate-950 font-extrabold text-xs sm:text-sm shadow-xs transition flex items-center gap-1.5 cursor-pointer"
                      >
                        <span>Selesai Ujian</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                        </svg>
                      </button>
                    `
                }
              </div>

            </div>

            <!-- Sidebar Navigasi Nomor Soal (Desktop) -->
            <aside class="hidden lg:block lg:col-span-4 sticky top-20 space-y-4">
              <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                <div class="bg-[#134e4a] px-4 py-3.5 text-white flex items-center justify-between">
                  <span class="font-bold text-sm">Navigasi Nomor Soal</span>
                  <span class="text-xs font-semibold text-[#fef08a]">${answeredCount}/${total} Dijawab</span>
                </div>

                <!-- Statistik Ringkas Real-time -->
                <div class="grid grid-cols-3 gap-2 p-3.5 bg-slate-50 border-b border-slate-200 text-center">
                  <div class="bg-white rounded-xl p-2 border border-slate-200">
                    <div class="text-base font-extrabold text-[#0f5c54]">${answeredCount}</div>
                    <div class="text-[11px] font-medium text-slate-500">Dijawab</div>
                  </div>
                  <div class="bg-white rounded-xl p-2 border border-slate-200">
                    <div class="text-base font-extrabold text-amber-500">${flaggedCount}</div>
                    <div class="text-[11px] font-medium text-slate-500">Ragu-ragu</div>
                  </div>
                  <div class="bg-white rounded-xl p-2 border border-slate-200">
                    <div class="text-base font-extrabold text-slate-700">${unansweredCount}</div>
                    <div class="text-[11px] font-medium text-slate-500">Belum</div>
                  </div>
                </div>

                <!-- Grid Nomor -->
                <div class="p-4 max-h-[400px] overflow-y-auto">
                  ${renderNumberGrid()}
                </div>

                <!-- Legenda Warna -->
                <div class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-600">
                  <div class="flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded bg-[#0f5c54] inline-block"></span>
                    <span>Dijawab</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded bg-[#eab308] inline-block"></span>
                    <span>Ragu-ragu</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded bg-white border border-slate-400 inline-block"></span>
                    <span>Kosong</span>
                  </div>
                </div>
              </div>
            </aside>

          </div>
        </main>

        <!-- Drawer Navigasi Mobile / Tablet -->
        ${
          state.mobileDrawerOpen
            ? `
              <div class="fixed inset-0 z-50 lg:hidden flex justify-end bg-slate-900/60 backdrop-blur-xs animate-fade-in">
                <div class="bg-white w-full max-w-sm h-full flex flex-col shadow-2xl">
                  <div class="bg-[#134e4a] px-4 py-4 text-white flex items-center justify-between">
                    <div>
                      <h3 class="font-bold text-sm">Navigasi Nomor Soal</h3>
                      <p class="text-[11px] text-emerald-200">${answeredCount} Dijawab • ${flaggedCount} Ragu • ${unansweredCount} Kosong</p>
                    </div>
                    <button
                      type="button"
                      onclick="toggleMobileDrawer(false)"
                      class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white"
                      aria-label="Tutup Drawer"
                    >
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                      </svg>
                    </button>
                  </div>
                  <div class="p-4 flex-1 overflow-y-auto">
                    ${renderNumberGrid()}
                  </div>
                  <div class="p-4 border-t border-slate-200 bg-slate-50">
                    <button
                      type="button"
                      onclick="toggleMobileDrawer(false); openConfirmFinishModal();"
                      class="w-full py-3 rounded-xl bg-[#eab308] text-slate-950 font-extrabold text-sm shadow-sm"
                    >
                      Selesai Ujian Sekarang
                    </button>
                  </div>
                </div>
              </div>
            `
            : ""
        }
      `;
    }

    function renderReferenceMarkup(refText) {
      if (!refText) return "-";
      const isUrl = /^https?:\/\//i.test(refText.trim());
      if (isUrl) {
        const safeUrl = escapeHTML(refText.trim());
        return `
          <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[#0f5c54] hover:text-[#0b4640] underline font-semibold break-all">
            <span>${safeUrl}</span>
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
            </svg>
          </a>
        `;
      }
      const safeStr = escapeHTML(refText.trim());
      return `
        <span class="text-slate-700 font-medium">${safeStr}</span>
        <button
          type="button"
          onclick='copyTextToClipboard(${JSON.stringify(refText.trim())})'
          class="ml-1.5 inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-semibold transition"
          title="Salin sitasi referensi"
        >
          Salin
        </button>
      `;
    }

    /**
     * ============================================================================
     * RENDER 3: HALAMAN HASIL, SKOR & PEMBAHASAN LENGKAP
     * ============================================================================
     */
    function renderResults() {
      const total = state.sessionQuestions.length;
      let correctCount = 0;
      let wrongCount = 0;
      let emptyCount = 0;

      // Hitung agregat global & per bidang ilmu
      const categoryStatsMap = {};

      const evaluatedList = state.sessionQuestions.map((q, idx) => {
        const ans = state.userAnswers[idx];
        let status = "unanswered";
        if (ans === null) {
          emptyCount += 1;
          status = "unanswered";
        } else if (ans === q.correctIndex) {
          correctCount += 1;
          status = "correct";
        } else {
          wrongCount += 1;
          status = "wrong";
        }

        if (!categoryStatsMap[q.category]) {
          categoryStatsMap[q.category] = { category: q.category, total: 0, correct: 0 };
        }
        categoryStatsMap[q.category].total += 1;
        if (status === "correct") {
          categoryStatsMap[q.category].correct += 1;
        }

        return {
          sessionNo: idx + 1,
          q,
          userAns: ans,
          status
        };
      });

      const rawScore = total > 0 ? (correctCount / total) * 100 : 0;
      const displayScore = Number.isInteger(rawScore) ? rawScore : rawScore.toFixed(1);
      const isPassed = rawScore >= 65;

      const categoryStats = Object.values(categoryStatsMap);
      const missedCount = wrongCount + emptyCount;

      // Terapkan Filter & Pencarian pada Pembahasan
      const searchLower = state.reviewSearch.trim().toLowerCase();
      const filteredReviews = evaluatedList.filter((item) => {
        if (state.reviewFilter !== "all" && item.status !== state.reviewFilter) {
          return false;
        }
        if (state.reviewCategoryFilter !== "all" && item.q.category !== state.reviewCategoryFilter) {
          return false;
        }
        if (searchLower) {
          const haystack = [
            `soal ${item.sessionNo}`,
            `#${item.q.id}`,
            item.q.category,
            item.q.kasus,
            item.q.tanya,
            ...item.q.options,
            item.q.pembahasan,
            item.q.ref
          ]
            .join(" ")
            .toLowerCase();
          if (!haystack.includes(searchLower)) return false;
        }
        return true;
      });

      return `
        <!-- Header Hasil -->
        <header class="bg-gradient-to-r from-[#134e4a] via-[#0f5c54] to-[#134e4a] text-white shadow-md border-b-4 border-[#eab308]">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-[#fef08a] mb-0.5">
                Laporan Evaluasi Hasil CBT
              </div>
              <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">
                TRY OUT BATCH 3 — SIGAP UKMPPDH
              </h1>
              <p class="text-xs sm:text-sm text-emerald-100 mt-0.5">
                Peserta: <strong class="text-white">${escapeHTML(state.participantName)}</strong> • ${escapeHTML(state.sessionLabel)}
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              ${
                missedCount > 0
                  ? `
                    <button
                      type="button"
                      onclick="retryWrongQuestions()"
                      class="px-4 py-2.5 rounded-xl bg-[#eab308] hover:bg-[#ca8a04] text-slate-950 font-extrabold text-xs sm:text-sm shadow-sm transition flex items-center gap-2 cursor-pointer"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                      </svg>
                      <span>Kerjakan Ulang Soal yang Salah (${missedCount})</span>
                    </button>
                  `
                  : ""
              }
              <button
                type="button"
                onclick="backToLobby()"
                class="px-4 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/25 text-white font-bold text-xs sm:text-sm transition cursor-pointer"
              >
                Kembali ke Menu Utama
              </button>
            </div>
          </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
          
          <!-- Grid Atas: Kartu Skor Akhir & Analisis Per Bidang Ilmu -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
            
            <!-- Kartu Skor Akhir (Skala 100) -->
            <section class="lg:col-span-5 bg-white rounded-2xl shadow-xs border border-slate-200 p-6 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Skor Akhir CBT</span>
                  <span class="px-3 py-1 rounded-full text-xs font-extrabold tracking-wide ${
                    isPassed
                      ? "bg-emerald-100 text-emerald-800 border border-emerald-300"
                      : "bg-rose-100 text-rose-800 border border-rose-300"
                  }">
                    ${isPassed ? "LULUS (STANDAR UKMPPDH)" : "PERLU EVALUASI (< 65)"}
                  </span>
                </div>

                <div class="flex items-baseline gap-2 my-2">
                  <span class="text-5xl sm:text-6xl font-extrabold tracking-tight ${
                    isPassed ? "text-[#0f5c54]" : "text-rose-600"
                  }">${displayScore}</span>
                  <span class="text-lg font-bold text-slate-400">/ 100</span>
                </div>
                <p class="text-xs text-slate-500 mb-5">
                  Batas kelulusan nasional (Passing Grade) simulasi UKMPPDH adalah skor <strong>65.0</strong>.
                </p>
              </div>

              <!-- Rincian Benar, Salah, Kosong, Durasi -->
              <div class="space-y-3">
                <div class="grid grid-cols-3 gap-2.5 text-center">
                  <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200">
                    <div class="text-xl font-extrabold text-emerald-700">${correctCount}</div>
                    <div class="text-[11px] font-bold text-emerald-800">Benar</div>
                  </div>
                  <div class="p-3 rounded-xl bg-rose-50 border border-rose-200">
                    <div class="text-xl font-extrabold text-rose-700">${wrongCount}</div>
                    <div class="text-[11px] font-bold text-rose-800">Salah</div>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-100 border border-slate-200">
                    <div class="text-xl font-extrabold text-slate-700">${emptyCount}</div>
                    <div class="text-[11px] font-bold text-slate-600">Kosong</div>
                  </div>
                </div>

                <div class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs sm:text-sm">
                  <span class="text-slate-600 font-medium flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-[#0f5c54]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    Durasi Pengerjaan
                  </span>
                  <span class="font-bold text-slate-900">${formatDurationText(state.elapsedSeconds)}</span>
                </div>
              </div>
            </section>

            <!-- Grafik / Progress Bar Analisis Performa per Bidang Ilmu -->
            <section class="lg:col-span-7 bg-white rounded-2xl shadow-xs border border-slate-200 p-6 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-4">
                  <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-900">Analisis Performa per Bidang Ilmu</h2>
                    <p class="text-xs text-slate-500">Persentase ketepatan jawaban berdasarkan topik kedokteran hewan</p>
                  </div>
                </div>

                <div class="space-y-3.5">
                  ${categoryStats
                    .map((cat) => {
                      const pct = cat.total > 0 ? Math.round((cat.correct / cat.total) * 100) : 0;
                      const barColor =
                        pct >= 65
                          ? "bg-[#0f5c54]"
                          : pct >= 50
                          ? "bg-[#eab308]"
                          : "bg-rose-500";
                      const badgeText =
                        pct >= 65
                          ? "text-[#0f5c54]"
                          : pct >= 50
                          ? "text-amber-700"
                          : "text-rose-600";

                      return `
                        <div>
                          <div class="flex items-center justify-between text-xs sm:text-sm mb-1">
                            <span class="font-semibold text-slate-800">${escapeHTML(cat.category)}</span>
                            <span class="font-bold ${badgeText}">
                              ${cat.correct}/${cat.total} (${pct}%)
                            </span>
                          </div>
                          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                            <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                          </div>
                        </div>
                      `;
                    })
                    .join("")}
                </div>
              </div>

              <div class="mt-5 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-4 text-[11px] text-slate-500">
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#0f5c54]"></span> Kompeten (&ge; 65%)</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#eab308]"></span> Cukup (50%–64%)</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Perlu Pendalaman (&lt; 50%)</span>
              </div>
            </section>

          </div>

          <!-- Bagian Filter & Pencarian Pembahasan -->
          <section class="bg-white rounded-2xl shadow-xs border border-slate-200 p-4 sm:p-5 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <!-- Tab Filter Status -->
              <div class="flex flex-wrap items-center gap-2">
                ${[
                  { id: "all", label: `Semua Soal (${total})` },
                  { id: "wrong", label: `Jawaban Salah (${wrongCount})` },
                  { id: "correct", label: `Jawaban Benar (${correctCount})` },
                  { id: "unanswered", label: `Tidak Dijawab (${emptyCount})` }
                ]
                  .map((tab) => {
                    const active = state.reviewFilter === tab.id;
                    return `
                      <button
                        type="button"
                        onclick="state.reviewFilter = '${tab.id}'; render();"
                        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${
                          active
                            ? "bg-[#0f5c54] text-white shadow-xs"
                            : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                        }"
                      >
                        ${tab.label}
                      </button>
                    `;
                  })
                  .join("")}
              </div>

              <!-- Filter Kategori & Search -->
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                <select
                  onchange="state.reviewCategoryFilter = this.value; render();"
                  class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs sm:text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0f5c54]"
                >
                  <option value="all" ${state.reviewCategoryFilter === "all" ? "selected" : ""}>Semua Bidang Ilmu</option>
                  ${categoryStats
                    .map(
                      (c) =>
                        `<option value="${escapeHTML(c.category)}" ${
                          state.reviewCategoryFilter === c.category ? "selected" : ""
                        }>${escapeHTML(c.category)}</option>`
                    )
                    .join("")}
                </select>

                <div class="relative min-w-[230px]">
                  <input
                    id="review-search-input"
                    type="text"
                    value="${escapeHTML(state.reviewSearch)}"
                    oninput="handleReviewSearch(this.value)"
                    placeholder="Cari kata kunci soal/pembahasan..."
                    class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-xs sm:text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#0f5c54]"
                  />
                  <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                  </svg>
                </div>
              </div>
            </div>
          </section>

          <!-- Daftar Kartu Review Pembahasan per Soal -->
          <section id="review-cards-list" class="space-y-4">
            ${
              filteredReviews.length === 0
                ? `
                  <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
                    <p class="text-slate-600 font-semibold text-sm">Tidak ada soal yang sesuai dengan filter atau kata kunci pencarian Anda.</p>
                    <button
                      type="button"
                      onclick="state.reviewFilter = 'all'; state.reviewCategoryFilter = 'all'; state.reviewSearch = ''; render();"
                      class="mt-3 px-4 py-2 rounded-xl bg-[#0f5c54] text-white text-xs font-bold"
                    >
                      Reset Filter Pembahasan
                    </button>
                  </div>
                `
                : filteredReviews
                    .map(({ sessionNo, q, userAns, status }) => {
                      const statusBadge =
                        status === "correct"
                          ? `<span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-extrabold">Benar</span>`
                          : status === "wrong"
                          ? `<span class="px-3 py-1 rounded-full bg-rose-100 text-rose-800 border border-rose-300 text-xs font-extrabold">Salah</span>`
                          : `<span class="px-3 py-1 rounded-full bg-slate-200 text-slate-700 text-xs font-extrabold">Tidak Dijawab</span>`;

                      return `
                        <article class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                          <!-- Top Bar Card -->
                          <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-2">
                              <span class="px-2.5 py-1 rounded-lg bg-[#134e4a] text-white font-extrabold text-xs">
                                Soal #${sessionNo} ${sessionNo !== q.id ? `(Bank No. ${q.id})` : ""}
                              </span>
                              <span class="px-2.5 py-1 rounded-lg bg-[#e6f4f1] text-[#0f5c54] font-bold text-xs">
                                ${escapeHTML(q.category)}
                              </span>
                            </div>
                            ${statusBadge}
                          </div>

                          <!-- Body Card -->
                          <div class="p-5 sm:p-6 space-y-4">
                            ${
                              q.kasus
                                ? `
                                  <div class="p-4 rounded-xl bg-[#e6f4f1]/50 border-l-4 border-[#0f5c54] text-sm text-slate-800 leading-relaxed">
                                    <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#0f5c54] mb-1">Uraian Kasus</div>
                                    <p>${formatRichText(q.kasus)}</p>
                                  </div>
                                `
                                : ""
                            }

                            <p class="font-bold text-slate-900 text-sm sm:text-base leading-relaxed">
                              ${formatRichText(q.tanya)}
                            </p>

                            <!-- Opsi A-E Review -->
                            <div class="space-y-2">
                              ${q.options
                                .map((optText, optIdx) => {
                                  const letter = OPTION_LETTERS[optIdx];
                                  const isKey = optIdx === q.correctIndex;
                                  const isUserPick = optIdx === userAns;

                                  let rowClass = "border-slate-200 bg-white text-slate-700";
                                  let badgeClass = "bg-slate-100 text-slate-600";
                                  let tags = "";

                                  if (isKey) {
                                    rowClass = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold";
                                    badgeClass = "bg-emerald-600 text-white";
                                    tags += `<span class="px-2 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-bold">Kunci Jawaban</span>`;
                                  }
                                  if (isUserPick && !isKey) {
                                    rowClass = "border-rose-500 bg-rose-50 text-rose-950 font-semibold";
                                    badgeClass = "bg-rose-600 text-white";
                                    tags += `<span class="px-2 py-0.5 rounded bg-rose-600 text-white text-[11px] font-bold">Jawaban Anda (Salah)</span>`;
                                  } else if (isUserPick && isKey) {
                                    tags += `<span class="px-2 py-0.5 rounded bg-[#0f5c54] text-white text-[11px] font-bold">Jawaban Anda</span>`;
                                  }

                                  return `
                                    <div class="p-3 rounded-xl border flex flex-wrap sm:flex-nowrap items-center gap-3 text-xs sm:text-sm ${rowClass}">
                                      <span class="w-7 h-7 rounded-lg font-extrabold text-xs flex items-center justify-center shrink-0 ${badgeClass}">
                                        ${letter}
                                      </span>
                                      <span class="flex-1 leading-snug">${formatRichText(optText)}</span>
                                      ${tags ? `<div class="flex items-center gap-1.5 ml-auto shrink-0">${tags}</div>` : ""}
                                    </div>
                                  `;
                                })
                                .join("")}
                            </div>

                            <!-- Kotak Pembahasan & Referensi Literatur -->
                            <div class="mt-4 p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                              <div>
                                <div class="text-xs font-extrabold uppercase tracking-wider text-[#0f5c54] mb-1 flex items-center gap-1.5">
                                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
                                  </svg>
                                  <span>Pembahasan Mendalam</span>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-800 leading-relaxed">
                                  ${formatRichText(q.pembahasan)}
                                </p>
                              </div>

                              <div class="pt-2.5 border-t border-slate-200 text-xs text-slate-600">
                                <span class="font-bold text-slate-800">Referensi Literatur: </span>
                                ${renderReferenceMarkup(q.ref)}
                              </div>
                            </div>
                          </div>
                        </article>
                      `;
                    })
                    .join("")
            }
          </section>

          <!-- Tombol Aksi Bawah -->
          <div class="flex flex-wrap items-center justify-center gap-3 pt-2 pb-6">
            ${
              missedCount > 0
                ? `
                  <button
                    type="button"
                    onclick="retryWrongQuestions()"
                    class="px-5 py-3 rounded-xl bg-[#eab308] hover:bg-[#ca8a04] text-slate-950 font-extrabold text-sm shadow-sm transition cursor-pointer"
                  >
                    Kerjakan Ulang Soal yang Salah (${missedCount})
                  </button>
                `
                : ""
            }
            <button
              type="button"
              onclick="backToLobby()"
              class="px-5 py-3 rounded-xl bg-[#0f5c54] hover:bg-[#0b4640] text-white font-bold text-sm shadow-sm transition cursor-pointer"
            >
              Kembali ke Menu Utama
            </button>
          </div>

        </main>
      `;
    }

    function handleReviewSearch(val) {
      state.reviewSearch = val;
      const activeEl = document.activeElement;
      const selStart = activeEl && activeEl.selectionStart ? activeEl.selectionStart : val.length;
      render();
      const restoredInput = document.getElementById("review-search-input");
      if (restoredInput) {
        restoredInput.focus();
        restoredInput.setSelectionRange(selStart, selStart);
      }
    }

    /**
     * ============================================================================
     * RENDER UTAMA APLIKASI
     * ============================================================================
     */
    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      if (state.screen === "lobby") {
        app.innerHTML = renderLobby();
      } else if (state.screen === "exam") {
        app.innerHTML = renderExam();
      } else if (state.screen === "results") {
        app.innerHTML = renderResults();
      }
    }

    // Inisialisasi aplikasi saat halaman dimuat
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
