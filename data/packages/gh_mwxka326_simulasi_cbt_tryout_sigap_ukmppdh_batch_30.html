    // =========================================================================

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(totalSeconds) {
      const secs = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      if (h > 0) {
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function formatDurationText(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      if (m === 0) return `${s} detik`;
      return `${m} menit ${s} detik`;
    }

    function formatReferenceHtml(refText) {
      if (!refText) return "-";
      const parts = refText.split("|").map(p => p.trim()).filter(Boolean);
      return parts.map(part => {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return escapeHtml(part).replace(urlRegex, (url) => {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[#0f5c54] underline decoration-[#eab308] decoration-2 underline-offset-2 hover:text-[#134e4a] font-medium break-all">${url}<svg class="w-3.5 h-3.5 shrink-0 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>`;
        });
      }).join('<span class="mx-2 text-slate-300">|</span>');
    }

    function showToast(message, type = "info") {
      const root = document.getElementById("toast-root");
      const toast = document.createElement("div");
      const colors = {
        info: "bg-[#134e4a] text-white border-[#eab308]",
        success: "bg-emerald-700 text-white border-emerald-400",
        warning: "bg-amber-600 text-white border-amber-300"
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border-l-4 text-sm font-medium animate-fade-in ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      root.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(6px)";
        toast.style.transition = "all 0.25s ease";
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

      const root = document.getElementById("modal-root");
      root.innerHTML = htmlContent;
      root.classList.remove("hidden");
      root.classList.add("flex");
    }

    function closeModal() {
      const root = document.getElementById("modal-root");
      root.classList.add("hidden");
      root.classList.remove("flex");
      root.innerHTML = "";
    }

    // =========================================================================
    // SESSION & TIMER LOGIC
    // =========================================================================
    function startExamSession() {
      const selectedPacket = PACKETS.find(p => p.id === appState.packetId) || PACKETS[0];
      let pool = selectedPacket.filter();

      // Acak urutan soal jika diaktifkan (kecuali random20 yang sudah acak, namun tetap aman)
      if (appState.shuffleQuestions && appState.packetId !== "random20") {
        pool = shuffleArray(pool);
      }

      const keys = ["a", "b", "c", "d", "e"];
      appState.activeQuestions = pool.map((q, index) => {
        let optionEntries = keys.map(k => ({
          origKey: k,
          text: q.options[k]
        }));

        if (appState.shuffleOptions) {
          optionEntries = shuffleArray(optionEntries);
        }

        let correctLabel = q.answer;
        const displayOptions = optionEntries.map((entry, idx) => {
          const newLabel = keys[idx];
          if (entry.origKey === q.answer) {
            correctLabel = newLabel;
          }
          return {
            label: newLabel,
            origKey: entry.origKey,
            text: entry.text
          };
        });

        return {
          ...q,
          sessionIndex: index,
          displayOptions,
          correctLabel
        };
      });

      appState.currentIndex = 0;
      appState.answers = {};
      appState.flagged = {};
      appState.elapsedSeconds = 0;
      appState.totalTime = appState.activeQuestions.length * 60; // 1 menit per soal
      appState.timeRemaining = appState.totalTime;
      appState.mobileNavOpen = false;
      appState.view = "exam";

      startTimer();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startTimer() {
      stopTimer();
      appState.timerInterval = setInterval(() => {
        appState.elapsedSeconds += 1;
        if (appState.mode === "cbt") {
          appState.timeRemaining -= 1;
          updateTimerDOM();
          if (appState.timeRemaining <= 0) {
            stopTimer();
            showToast("Waktu ujian telah habis! Jawaban otomatis dikumpulkan.", "warning");
            finishExam();
          }
        } else {
          updateTimerDOM();
        }
      }, 1000);
    }

    function stopTimer() {
      if (appState.timerInterval) {
        clearInterval(appState.timerInterval);
        appState.timerInterval = null;
      }
    }

    function updateTimerDOM() {
      const timerEl = document.getElementById("header-timer-text");
      const timerBox = document.getElementById("header-timer-box");
      if (!timerEl) return;

      if (appState.mode === "cbt") {
        timerEl.textContent = formatTime(appState.timeRemaining);
        if (timerBox) {
          if (appState.timeRemaining <= 300) {
            timerBox.className = "flex items-center gap-2 px-3 py-1.5 rounded-lg bg-red-600 text-white font-mono font-bold text-sm sm:text-base shadow-sm timer-urgent";
          } else if (appState.timeRemaining <= 600) {
            timerBox.className = "flex items-center gap-2 px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-mono font-bold text-sm sm:text-base shadow-sm";
          }
        }
      } else {
        timerEl.textContent = formatTime(appState.elapsedSeconds);
      }
    }

              <!-- 5 Answer Options (a - e) -->
              <div class="space-y-2.5 pt-1">
                ${q.displayOptions.map(opt => {
                  const isSelected = userAnswer === opt.label;
                  const isCorrectOpt = opt.label === q.correctLabel;

                  let wrapperClass = "border-slate-200 bg-white hover:border-[#0f5c54]/60 hover:bg-slate-50/90 text-slate-800";
                  let badgeClass = "bg-slate-100 text-slate-700 border-slate-300 group-hover:bg-[#0f5c54] group-hover:text-white group-hover:border-[#0f5c54]";

                  if (isPracticeAnswered) {
                    if (isCorrectOpt) {

                      badgeClass = "bg-emerald-600 text-white border-emerald-600";

                      wrapperClass = "border-red-500 bg-red-50 text-red-950 ring-1 ring-red-500";
                      badgeClass = "bg-red-600 text-white border-red-600";
                      statusTag = `<span class="ml-auto shrink-0 px-2 py-0.5 rounded bg-red-600 text-white text-[11px] font-bold">JAWABAN ANDA</span>`;
                    } else {
                      wrapperClass = "border-slate-200 bg-slate-50/60 text-slate-500 opacity-80";

                      <span class="font-bold text-slate-800">Referensi Literatur:</span> ${formatReferenceHtml(q.reference)}
                    </div>
                  </div>
                `;
              })() : ""}
            </div>

            <!-- Question Card Footer Controls -->
            <div class="px-4 sm:px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2 flex-wrap">
              <!-- Previous -->
              <button
                type="button"
                onclick="goToQuestion(${idx - 1})"
                ${idx === 0 ? "disabled" : ""}
                class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none text-slate-700 font-semibold text-xs sm:text-sm transition flex items-center gap-1.5"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              >
                <svg class="w-4 h-4" fill="${isFlagged ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/>

                <span>${isFlagged ? "Ditandai Ragu-ragu" : "Ragu-ragu"}</span>

              <!-- Next or Finish -->
              ${idx < total - 1 ? `
                <button
                  type="button"
                  onclick="goToQuestion(${idx + 1})"

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                  </svg>

              ` : `
                <button
                  type="button"

                  <span>Selesai & Kumpulkan</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                  </svg>
                </button>

            </div>
          </section>

          <!-- Right Sidebar: Desktop Question Navigator (4 cols) -->

              <h2 class="font-bold text-slate-900 text-sm">Navigasi Nomor Soal</h2>
              <span class="text-xs font-semibold text-[#0f5c54]">${answeredCount}/${total} Dijawab</span>

            <!-- Number Grid -->

              ${renderNavGrid()}

            <!-- Color Legend -->
            <div class="pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-600">
              <div class="flex items-center gap-2">

                <span>Dijawab (${answeredCount})</span>

              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded bg-amber-400 border border-amber-500 inline-block shrink-0"></span>

                <span class="w-4 h-4 rounded bg-white border border-slate-300 inline-block shrink-0"></span>

              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded bg-white border-2 border-slate-900 ring-2 ring-[#eab308] inline-block shrink-0"></span>

            <button

            </button>

        </div>

        <!-- Mobile Question Navigator Drawer/Modal -->
        ${appState.mobileNavOpen ? `
          <div class="fixed inset-0 z-40 lg:hidden bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">

    // =========================================================================
    // RENDER: HALAMAN HASIL, SKOR & PEMBAHASAN LENGKAP
    // =========================================================================
    function renderResult() {
      const questions = appState.activeQuestions;
      const total = questions.length;
      let correctCount = 0;
      let wrongCount = 0;
      let unansweredCount = 0;

      // Category breakdown map
      const categoryStats = {};

      const evaluatedList = questions.map((q, idx) => {
        const userAns = appState.answers[idx];
        let status = "unanswered";
        if (userAns === undefined) {
          unansweredCount++;
          status = "unanswered";
        } else if (userAns === q.correctLabel) {
          correctCount++;
          status = "correct";
        } else {
          wrongCount++;
          status = "wrong";
        }

        if (!categoryStats[q.category]) {
          categoryStats[q.category] = { category: q.category, total: 0, correct: 0 };
        }
        categoryStats[q.category].total += 1;
        if (status === "correct") {
          categoryStats[q.category].correct += 1;
        }

        return {
          ...q,
          userAns,
          status
        };
      });

      const score = total > 0 ? ((correctCount / total) * 100).toFixed(2) : "0.00";
      const numericScore = parseFloat(score);
      const isPassed = numericScore >= 65;
      const selectedPacket = PACKETS.find(p => p.id === appState.packetId) || PACKETS[0];

      // Filter evaluated list for review
      const query = appState.searchQuery.trim().toLowerCase();
      const filteredReviews = evaluatedList.filter(item => {
        if (appState.resultFilter !== "all" && item.status !== appState.resultFilter) {
          return false;
        }
        if (query) {
          const haystack = `${item.question} ${item.category} ${item.explanation} ${item.reference}`.toLowerCase();
          return haystack.includes(query);
        }
        return true;
      });

      const categoryArray = Object.values(categoryStats).sort((a, b) => {
        const pctA = a.correct / a.total;
        const pctB = b.correct / b.total;
        return pctB - pctA;
      });

      return `
        <!-- Result Header -->
        <header class="bg-gradient-to-r from-[#093833] via-[#0f5c54] to-[#134e4a] text-white shadow-lg border-b-4 border-[#eab308]">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-[#eab308]">Laporan Hasil Simulasi CBT</div>
              <h1 class="text-xl sm:text-2xl font-extrabold mt-0.5">TRY OUT BATCH 30 - SIGAP UKMPPDH</h1>
              <p class="text-xs sm:text-sm text-emerald-100 mt-1">
                Peserta: <strong>${escapeHtml(appState.participantName || "Calon Dokter Hewan")}</strong> • Paket: <strong>${selectedPacket.title}</strong>
              </p>
            </div>
            <div class="flex items-center gap-2.5 no-print">
              <button
                type="button"
                onclick="window.print()"
                class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs sm:text-sm font-semibold border border-white/20 transition flex items-center gap-1.5"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                </svg>
                <span>Cetak / PDF</span>
              </button>
              <button
                type="button"
                onclick="startExamSession()"
                class="px-3.5 py-2 rounded-xl bg-[#eab308] hover:bg-[#ca8a04] text-slate-950 text-xs sm:text-sm font-bold shadow transition"
              >
                Ulangi Ujian
              </button>
              <button
                type="button"
                onclick="returnToLobby()"
                class="px-3.5 py-2 rounded-xl bg-white text-[#0f5c54] hover:bg-emerald-50 text-xs sm:text-sm font-bold shadow transition"
              >
                Menu Utama
              </button>
            </div>
          </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6 animate-fade-in">
          <!-- Top Summary Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Score Card -->
            <div class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Nilai Akhir (Skala 100)</span>
                  <div class="text-5xl font-extrabold mt-1 ${isPassed ? 'text-[#0f5c54]' : 'text-red-600'}">
                    ${score}
                  </div>
                </div>
                <div class="px-3.5 py-1.5 rounded-xl font-extrabold text-xs tracking-wide border ${isPassed ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-red-50 text-red-800 border-red-300'}">
                  ${isPassed ? "✓ LULUS (≥ 65)" : "✕ BELUM LULUS (< 65)"}
                </div>
              </div>

              <div class="mt-5 pt-4 border-t border-slate-100 space-y-2 text-xs text-slate-600">
                <div class="flex justify-between">
                  <span>Batas Kelulusan (Passing Grade):</span>
                  <strong class="text-slate-900">65.00</strong>
                </div>
                <div class="flex justify-between">
                  <span>Waktu Pengerjaan:</span>
                  <strong class="text-slate-900">${formatDurationText(appState.elapsedSeconds)}</strong>
                </div>
                <div class="flex justify-between">
                  <span>Mode Simulasi:</span>
                  <strong class="text-slate-900">${appState.mode === 'cbt' ? 'Mode Ujian CBT' : 'Mode Latihan Interaktif'}</strong>
                </div>
              </div>
            </div>

            <!-- 4 Stat Boxes -->
            <div class="lg:col-span-7 grid grid-cols-2 sm:grid-cols-4 gap-3.5">
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                <span class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-base">✓</span>
                <div class="mt-4">
                  <div class="text-3xl font-extrabold text-emerald-700">${correctCount}</div>
                  <div class="text-xs font-semibold text-slate-500 mt-0.5">Jawaban Benar</div>
                </div>
              </div>

              <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                <span class="w-9 h-9 rounded-xl bg-red-100 text-red-700 flex items-center justify-center font-bold text-base">✕</span>
                <div class="mt-4">
                  <div class="text-3xl font-extrabold text-red-600">${wrongCount}</div>
                  <div class="text-xs font-semibold text-slate-500 mt-0.5">Jawaban Salah</div>
                </div>
              </div>

              <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                <span class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-base">–</span>
                <div class="mt-4">
                  <div class="text-3xl font-extrabold text-slate-700">${unansweredCount}</div>
                  <div class="text-xs font-semibold text-slate-500 mt-0.5">Tidak Dijawab</div>
                </div>
              </div>

              <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                <span class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-base">%</span>
                <div class="mt-4">
                  <div class="text-3xl font-extrabold text-amber-600">${Math.round((correctCount / total) * 100)}%</div>
                  <div class="text-xs font-semibold text-slate-500 mt-0.5">Tingkat Akurasi</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Analisis Per Bidang Ilmu -->
          <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-4">
              <h2 class="text-base sm:text-lg font-extrabold text-slate-900">Analisis Kompetensi Per Bidang Ilmu</h2>
              <span class="text-xs text-slate-500">Persentase jawaban benar tiap kategori topik</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3.5">
              ${categoryArray.map(cat => {
                const pct = Math.round((cat.correct / cat.total) * 100);
                let barColor = "bg-[#0f5c54]";
                if (pct < 50) barColor = "bg-red-500";
                else if (pct < 65) barColor = "bg-amber-500";

                return `
                  <div>
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="font-semibold text-slate-800 truncate pr-2">${escapeHtml(cat.category)}</span>
                      <span class="font-bold text-slate-700 shrink-0">${cat.correct}/${cat.total} (${pct}%)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>

          <!-- Review Pembahasan Lengkap -->
          <section class="space-y-4">
            <!-- Filter & Search Header -->
            <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3.5 no-print">
              <div class="flex items-center gap-1.5 flex-wrap">
                <button
                  type="button"
                  onclick="appState.resultFilter='all'; render();"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${appState.resultFilter === 'all' ? 'bg-[#0f5c54] text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}"
                >
                  Semua (${total})
                </button>
                <button
                  type="button"
                  onclick="appState.resultFilter='wrong'; render();"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${appState.resultFilter === 'wrong' ? 'bg-red-600 text-white' : 'bg-red-50 text-red-700 hover:bg-red-100'}"
                >
                  Salah (${wrongCount})
                </button>
                <button
                  type="button"
                  onclick="appState.resultFilter='correct'; render();"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${appState.resultFilter === 'correct' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'}"
                >
                  Benar (${correctCount})
                </button>
                <button
                  type="button"
                  onclick="appState.resultFilter='unanswered'; render();"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${appState.resultFilter === 'unanswered' ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}"
                >
                  Kosong (${unansweredCount})
                </button>
              </div>

              <!-- Search input -->
              <div class="relative w-full md:w-72">
                <input
                  type="text"
                  value="${escapeHtml(appState.searchQuery)}"
                  oninput="appState.searchQuery = this.value; render();"
                  placeholder="Cari kata kunci soal / penyakit..."
                  class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-[#0f5c54]"
                />
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>
            </div>

            <!-- Question Review Cards -->
            ${filteredReviews.length === 0 ? `
              <div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-500 text-sm">
                Tidak ada soal yang sesuai dengan filter atau pencarian Anda.
              </div>
            ` : filteredReviews.map(item => {
              const statusBadge = {
                correct: `<span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-xs">✓ BENAR</span>`,
                wrong: `<span class="px-2.5 py-1 rounded-lg bg-red-100 text-red-800 font-bold text-xs">✕ SALAH</span>`,
                unanswered: `<span class="px-2.5 py-1 rounded-lg bg-slate-200 text-slate-700 font-bold text-xs">– KOSONG</span>`
              }[item.status];

              return `
                <article class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-break-inside">
                  <!-- Header -->
                  <div class="px-4 sm:px-6 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="px-2.5 py-1 rounded-lg bg-[#0f5c54] text-white font-bold text-xs">
                        No. ${item.sessionIndex + 1}
                      </span>
                      ${appState.shuffleQuestions ? `<span class="text-xs text-slate-500 font-medium">(Soal Asli #${item.id})</span>` : ""}
                      <span class="px-2.5 py-1 rounded-lg bg-slate-200/80 text-slate-700 font-semibold text-xs">
                        ${escapeHtml(item.category)}
                      </span>
                    </div>
                    <div class="flex items-center gap-2">
                      ${statusBadge}
                    </div>
                  </div>

                  <!-- Content -->
                  <div class="p-4 sm:p-6 space-y-4">
                    <p class="text-sm sm:text-base font-medium text-slate-900 leading-relaxed">
                      ${escapeHtml(item.question)}
                    </p>

                    <!-- Options List -->
                    <div class="space-y-2">
                      ${item.displayOptions.map(opt => {
                        const isKey = opt.label === item.correctLabel;
                        const isUserChoice = opt.label === item.userAns;

                        let rowClass = "border-slate-200 bg-white text-slate-700";
                        let letterClass = "bg-slate-100 text-slate-600";
                        let badges = "";

                        if (isKey) {
                          rowClass = "border-emerald-500 bg-emerald-50/90 text-emerald-950 font-medium";
                          letterClass = "bg-emerald-600 text-white";
                          badges += `<span class="px-2 py-0.5 rounded bg-emerald-600 text-white text-[10px] font-bold">KUNCI JAWABAN</span>`;
                        }
                        if (isUserChoice && !isKey) {
                          rowClass = "border-red-400 bg-red-50/90 text-red-950 font-medium";
                          letterClass = "bg-red-600 text-white";
                          badges += `<span class="px-2 py-0.5 rounded bg-red-600 text-white text-[10px] font-bold">JAWABAN ANDA</span>`;
                        } else if (isUserChoice && isKey) {
                          badges += `<span class="px-2 py-0.5 rounded bg-[#0f5c54] text-white text-[10px] font-bold">JAWABAN ANDA</span>`;
                        }

                        return `
                          <div class="p-3 rounded-xl border ${rowClass} flex items-start gap-3 text-sm">
                            <span class="w-6 h-6 rounded-md ${letterClass} font-bold text-xs uppercase flex items-center justify-center shrink-0 mt-0.5">
                              ${opt.label}
                            </span>
                            <span class="flex-1">${escapeHtml(opt.text)}</span>
                            <div class="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
                              ${badges}
                            </div>
                          </div>
                        `;
                      }).join("")}
                    </div>

                    <!-- Pembahasan Box -->
                    <div class="rounded-xl bg-[#e6f4f1]/70 border border-[#0f5c54]/25 p-4 space-y-1.5">
                      <div class="flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider text-[#0f5c54]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                        <span>Pembahasan</span>
                      </div>
                      <p class="text-sm text-slate-800 leading-relaxed">
                        ${escapeHtml(item.explanation)}
                      </p>
                    </div>

                    <!-- Referensi Literatur Box -->
                    <div class="rounded-xl bg-slate-50 border border-slate-200/90 px-4 py-3 text-xs text-slate-600">
                      <span class="font-bold text-slate-800">Referensi Literatur:</span>
                      <span class="ml-1">${formatReferenceHtml(item.reference)}</span>
                    </div>
                  </div>
                </article>
              `;
            }).join("")}
          </section>

          <!-- Bottom Action Footer -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4 pb-8 no-print">
            <button
              type="button"
              onclick="startExamSession()"
              class="w-full sm:w-auto px-6 py-3 rounded-xl bg-[#0f5c54] hover:bg-[#134e4a] text-white font-bold text-sm shadow transition"
            >
              Ulangi Paket Ujian Ini
            </button>
            <button
              type="button"
              onclick="returnToLobby()"
              class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 font-bold text-sm shadow-xs transition"
            >
              Kembali ke Menu Utama
            </button>
          </div>
        </main>
      `;
    }

    // =========================================================================
    // MAIN RENDER CONTROLLER
    // =========================================================================
    function render() {
      const appEl = document.getElementById("app");
      if (appState.view === "lobby") {
        appEl.innerHTML = renderLobby();
      } else if (appState.view === "exam") {
        appEl.innerHTML = renderExam();
      } else if (appState.view === "result") {
        appEl.innerHTML = renderResult();
      }
    }

    // Initialize Application
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
